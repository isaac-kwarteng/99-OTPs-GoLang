# Local stack: Redis (shared by the OTP app and Jasmin), RabbitMQ, the Jasmin
# SMS gateway, and an SMPP simulator standing in for a real carrier SMSC.
#
#   OTP app --HTTP :1401--> Jasmin --SMPP--> smscsim
#
# Sent messages (including OTP codes) are logged by Jasmin:
#   docker-compose exec jasmin tail -f /var/log/jasmin/messages.log
services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbit-mq:
    image: rabbitmq:3.13-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  jasmin:
    image: jookies/jasmin:0.11.0
    ports:
      - "1401:1401" # HTTP API used by the OTP app
      - "8990:8990" # jcli admin console (jcliadmin / jclipwd)
    environment:
      REDIS_CLIENT_HOST: redis
      AMQP_BROKER_HOST: rabbit-mq
    depends_on:
      redis:
        condition: service_healthy
      rabbit-mq:
        condition: service_healthy
      smscsim:
        condition: service_started

  # SMPP simulator: accepts every submit_sm and returns a DELIVERED receipt.
  smscsim:
    image: ukarim/smscsim:0.2.0

  # One-shot job that configures Jasmin through jcli: SMPP connector to
  # smscsim, a default MT route, and the HTTP API user the OTP app logs in as.
  jasmin-setup:
    image: alpine:3.20
    volumes:
      - ./jasmin/provision.sh:/provision.sh:ro
    entrypoint: ["sh", "/provision.sh"]
    depends_on:
      - jasmin
