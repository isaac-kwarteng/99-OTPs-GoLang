name: Build and Push Docker Image

on:
  push:
    branches:
      - main # adjust if needed

env:
  REGISTRY: ghcr.io
  ORG: vigil-hq # your GitHub organization
  DOCKERFILE: Dockerfile
  CONTEXT: . # build context (adjust if needed)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR under org

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract module name from go.mod
        id: modname
        run: |
          # Extract "marketdome/auth-api" from "github.com/marketdome/auth-api"
          IMAGE_PATH=$(grep '^module ' go.mod | awk '{print $2}' | sed 's#^github.com/##')
          echo "IMAGE_NAME=$IMAGE_PATH" >> $GITHUB_ENV
          echo "Using image: $IMAGE_PATH"

      - name: Extract Git SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -f ${{ env.DOCKERFILE }} \
            -t ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}:${{ env.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.CONTEXT }}

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}:${{ env.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}:latest